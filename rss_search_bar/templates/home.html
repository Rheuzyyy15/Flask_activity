<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philippine News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #d4a1f9, #fcd3fc, #a1c8fc);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        header {
            background-color: rgba(255, 255, 255, 0.9);
            width: 100%;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 2em;
            color: #6a1b9a;
            font-weight: bold;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            max-width: 800px;
            width: 100%;
            margin: 100px 0 20px;
            text-align: center;
        }

        .container p {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #555;
        }

        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        li {
            background-color: #f5e1fa;
            border-radius: 8px;
            padding: 10px 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        li:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        a {
            text-decoration: none;
            color: #6a1b9a;
            font-weight: bold;
            font-size: 1.1em;
        }

        a:hover {
            color: #d81b60;
        }

        footer {
            background-color: rgba(255, 255, 255, 0.9);
            width: 100%;
            padding: 15px;
            text-align: center;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
            position: fixed;
            bottom: 0;
            z-index: 100;
        }

        footer p {
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <h1>Philippine News</h1>
    </header>
    <div class="container">
        <p>Select a news source:</p>
        <ul>
            <li><a href="/tv5">TV5 News</a></li>
            <li><a href="/rappler">Rappler</a></li>
            <li><a href="/inquirer">Inquirer</a></li>
            <li><a href="/gma">GMA News</a></li>
            <li><a href="/abscbn">ABS-CBN News</a></li>
            <li><a href="/manilatimes">The Manila Times</a></li>
            <li><a href="/buhaymuntinlupa">Buhay Muntinlupa</a></li>
            <li><a href="/dzbb">DZBB</a></li>
            <li><a href="/news5">News5</a></li>
        </ul>
    </div>
    <footer>
        <p>&copy; 2025 Philippine News Portal. All rights reserved.</p>
    </footer>
</body>
</html>
